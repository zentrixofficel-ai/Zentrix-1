name: Build and Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java Environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        id: verify_apk
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "APK found: $APK_PATH"
            ls -lh "$APK_PATH"
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          else
            echo "ERROR: APK not found at $APK_PATH"
            find android/app/build/outputs/apk -name "*.apk" || true
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK Release Asset
        id: prepare_asset
        run: |
          mkdir -p /tmp/release_assets
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/release_assets/app-debug.apk
          echo "asset_path=/tmp/release_assets/app-debug.apk" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="zentix WB Debug APK Build #${{ github.run_number }}"

          gh release create "$TAG_NAME" /tmp/release_assets/app-debug.apk \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --notes "### zentix WB (Zx) Android Debug APK
- **Application ID:** com.zentixwb.com
- **Run Number:** #${{ github.run_number }}
- **Attempt:** ${{ github.run_attempt }}
- **Commit:** ${{ github.sha }}
- **Type:** Debug build for testing and installation on Android devices." \
            --latest

      - name: Report APK Download Result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIRECT_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"
          echo "### 📱 DIRECT APK DOWNLOAD" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Permanent Download Link: [$DIRECT_URL]($DIRECT_URL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Actions Artifact:** \`app-debug-apk\` is also uploaded and available as a backup." >> $GITHUB_STEP_SUMMARY
          echo "Direct APK URL: $DIRECT_URL"
